name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "Tag v$TAG does not match VERSION file ($VERSION)" >&2
              exit 1
            fi
          fi

      - name: Build and package
        env:
          AXON_SKIP_INSTALL: "1"
          AXON_PACKAGE: "1"
        run: bash Sources/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axon-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            .build/dist/Axon-${{ steps.version.outputs.version }}-macos-arm64.zip
            .build/dist/Axon-${{ steps.version.outputs.version }}-macos-arm64.zip.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP=".build/dist/Axon-${VERSION}-macos-arm64.zip"
          SUM="${ZIP}.sha256"
          {
            echo "macOS 26 · Apple Silicon (arm64) · ad-hoc 签名"
            echo
            echo "解压后将 \`ClaudeBar.app\` 拖到 \`/Applications\`（菜单栏与窗口显示名为 Axon）。"
            echo "若 Gatekeeper 拦截：\`xattr -cr /Applications/ClaudeBar.app\`。"
            echo
            echo "变更记录：[docs/CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docs/CHANGELOG.md)"
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Axon ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "$ZIP" "$SUM"
