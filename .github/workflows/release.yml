name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "Tag v$TAG does not match VERSION file ($VERSION)" >&2
              exit 1
            fi
          fi

      - name: Build release artifacts
        env:
          CLAUDEBAR_SKIP_INSTALL: "1"
          CLAUDEBAR_PACKAGE: "1"
        run: bash Sources/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeBar-${{ steps.version.outputs.version }}-macOS-arm64
          path: |
            .build/dist/ClaudeBar-${{ steps.version.outputs.version }}-macOS-arm64.dmg
            .build/dist/ClaudeBar-${{ steps.version.outputs.version }}-macOS-arm64.dmg.sha256
            .build/dist/ClaudeBar-${{ steps.version.outputs.version }}-macOS-arm64.zip
            .build/dist/ClaudeBar-${{ steps.version.outputs.version }}-macOS-arm64.zip.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BASE="ClaudeBar-${VERSION}-macOS-arm64"
          DMG=".build/dist/${BASE}.dmg"
          ZIP=".build/dist/${BASE}.zip"
          {
            echo "## Install"
            echo
            echo "1. Download **${BASE}.dmg** (recommended) or the \`.zip\` asset."
            echo "2. Open the DMG and drag **ClaudeBar** into **Applications**."
            echo "3. Launch from Applications or the menu bar."
            echo
            echo "**Requirements:** macOS 15+, Apple Silicon (arm64)."
            echo
            echo "This build is **ad-hoc signed** (not notarized). If Gatekeeper blocks it:"
            echo "\`\`\`bash"
            echo "xattr -cr /Applications/ClaudeBar.app"
            echo "open /Applications/ClaudeBar.app"
            echo "\`\`\`"
            echo
            echo "Checksums are attached as \`.sha256\` files."
            echo
            echo "## Changelog"
            echo
            echo "[docs/CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docs/CHANGELOG.md)"
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "ClaudeBar ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "$DMG" "${DMG}.sha256" "$ZIP" "${ZIP}.sha256"
