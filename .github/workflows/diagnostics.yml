name: Regression diagnostics

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Makefile 中登记的回归组，可用空格分隔"
        required: true
        default: "audio-accessory"
        type: string

permissions:
  contents: read

jobs:
  regression:
    name: Focused macOS regression
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test dependencies
        run: make setup
      - name: Regression diagnostics
        env:
          TEST: ${{ inputs.suite }}
        run: make test
