name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          cat VERSION

      - name: Build (no install)
        env:
          CLAUDEBAR_SKIP_INSTALL: "1"
        run: bash Sources/build.sh

      # The list lives in the Makefile and is invoked, not restated. It had
      # already drifted: six suites in `make test` (product-mark, greeting-name,
      # weather-astronomy, card-shadow, machine-mark, fan-rotor) were never run
      # here, so a red suite was green in CI. A second copy of the list is a
      # second chance to forget a file.
      - name: Regression tests
        run: make test

      - name: Smoke-check bundle
        run: |
          APP=".build/ClaudeBar.app"
          test -x "$APP/Contents/MacOS/ClaudeBar"
          test -x "$APP/Contents/PlugIns/ClaudeBarWidget.appex/Contents/MacOS/ClaudeBarWidget"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          echo "bundle OK"
