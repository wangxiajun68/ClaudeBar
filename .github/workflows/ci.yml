name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        channel: [dev, release]
    env:
      CLAUDEBAR_CHANNEL: ${{ matrix.channel }}
      CODESIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          cat VERSION

      # Pillow + numpy are what decode the brand PNGs. Two suites
      # (`product-mark` and `machine-mark`) and two generators
      # (`gen-brand-marks.py`, `make-claudebar-mark.py`) need them, and the
      # runner does not ship them — the first CI run that actually invoked
      # them died on `ModuleNotFoundError: No module named 'PIL'`. They were
      # only absent from CI until now because CI ran a hand-copied subset of
      # the list (see below).
      #
      # A venv rather than `pip install --user`: the runner's Python is
      # Homebrew's, so PEP 668 refuses the install outright and the only way
      # past it is `--break-system-packages`, which edits the interpreter the
      # rest of the image shares. Prepending the venv's `bin` to PATH makes
      # the plain `python3` in `make test` resolve to it instead.
      - name: Python imaging deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r Tests/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build (no install)
        env:
          CLAUDEBAR_SKIP_INSTALL: "1"
        run: bash Sources/build.sh

      # The list lives in the Makefile and is invoked, not restated. It had
      # already drifted: six suites in `make test` (product-mark, greeting-name,
      # weather-astronomy, card-shadow, machine-mark, fan-rotor) were never run
      # here, so a red suite was green in CI. A second copy of the list is a
      # second chance to forget a file.
      - name: Regression tests
        if: matrix.channel == 'dev'
        run: make test

      - name: Smoke-check bundle
        run: |
          PROJECT_DIR="$PWD"
          source Sources/build-config.sh
          test -x "$APP_BUNDLE/Contents/MacOS/$APP_EXECUTABLE"
          test -x "$APP_BUNDLE/Contents/PlugIns/ClaudeBarWidget.appex/Contents/MacOS/ClaudeBarWidget"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist"
          codesign --verify --deep --strict "$APP_BUNDLE"
          echo "bundle OK"
