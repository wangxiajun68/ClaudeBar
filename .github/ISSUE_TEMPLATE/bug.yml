name: 缺陷报告
description: 崩溃、数据显示错误、构建失败或交互异常
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查阅 [FAQ](https://github.com/wangxiajun68/ClaudeBar/blob/main/docs/FAQ.md)。
        **不要**粘贴 API key、token 或完整 `settings.json` / `config.toml`。
  - type: textarea
    id: what
    attributes:
      label: 实际结果 vs 期望结果
      placeholder: 描述发生了什么，以及你期望的行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 15.6 或 26.0
    validations:
      required: true
  - type: input
    id: claudebar
    attributes:
      label: ClaudeBar 版本
      placeholder: 设置 → 关于，或 Releases 页版本号
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - GitHub Releases DMG
        - 从源码 make build
        - 其他
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 安装 / 启动
        - 供应商切换
        - 会话监控
        - 用量统计
        - Codex 本地代理 / 流量
        - 菜单栏面板
        - 主窗口
        - 桌面 Widget
        - 构建 / CI
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: Console.app 中与 ClaudeBar 相关的行；敏感信息请打码
