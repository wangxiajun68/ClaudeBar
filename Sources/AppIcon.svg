<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3240"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
    <linearGradient id="mark" x1="300" y1="200" x2="724" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FD3F2"/>
      <stop offset="0.55" stop-color="#4FDDC0"/>
      <stop offset="1" stop-color="#2FE08C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3FE8B8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3FE8B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- squircle plate -->
  <g filter="url(#squircleShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#halo)"/>
    <rect x="103" y="103" width="818" height="818" rx="182" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
  </g>

  <!-- glow underlay of the A -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M 512 218 L 312 806 M 512 218 L 712 806 M 386 622 L 638 622"
          fill="none" stroke="#3FE8B8" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the A mark -->
  <path d="M 512 218 L 312 806 M 512 218 L 712 806 M 386 622 L 638 622"
        fill="none" stroke="url(#mark)" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signal node on the apex -->
  <circle cx="512" cy="218" r="20" fill="#EAFFF6"/>
</svg>
