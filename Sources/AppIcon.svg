    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#plate)"/>
  <g fill="none" stroke="#4A90E2" stroke-linecap="round" filter="url(#glow)">
    <line x1="512" y1="168" x2="512" y2="856" stroke-width="18"/>
