<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaudeBar — 把 AI 工作收进 macOS 顶栏</title>
<style>
:root{color-scheme:light;--bg:#eef3f8;--ink:#18252e;--muted:#52616d;--line:#cdd7df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:1320px;margin:auto;padding:44px 40px 64px}header{display:flex;align-items:center;gap:12px;margin-bottom:52px}header img{width:40px;height:40px}header strong{font-size:22px}header a{margin-left:auto}a{color:inherit;text-underline-offset:5px}h1{font-size:clamp(32px,4vw,56px);line-height:1.2;letter-spacing:-.025em;margin:0 0 18px}p{font-size:18px;line-height:1.7;color:var(--muted);margin:0 0 30px}video{width:100%;display:block;aspect-ratio:16/9;border-radius:16px;background:#16181c;box-shadow:0 18px 48px #18252e18}.chapters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 36px}.chapters button{appearance:none;border:1px solid var(--line);border-radius:8px;background:transparent;padding:12px 16px;font:inherit;color:var(--ink);cursor:pointer}.chapters button:hover,.chapters button[aria-current="true"]{background:var(--ink);color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #2864b4;outline-offset:4px}.links{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:32px}.links a{font-weight:600}footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px}@media(max-width:600px){main{padding:24px 20px 40px}header{margin-bottom:36px}header a{font-size:14px}.chapters{gap:8px}.chapters button{padding:10px 12px;font-size:14px}video{border-radius:8px}}
</style>
</head>
<body><main>
<header><img src="../../Sources/AppIcon-1024.png" alt=""><strong>ClaudeBar</strong><a href="https://github.com/wangxiajun68/ClaudeBar/releases/latest">下载 macOS 版</a></header>
<h1>从天气开始，走进 ClaudeBar。</h1>
<p>用一段连续的空间旅程，认识天气卡片、菜单栏 popup、灵动岛与原生桌面工作台。</p>
<video id="film" controls playsinline preload="metadata" poster="poster.png?cut=spatial" aria-label="ClaudeBar 设计介绍，66 秒，中文，静音">
<source src="claudebar.mp4?cut=spatial" type="video/mp4">
<track id="captions" kind="captions" src="captions.zh.vtt?cut=spatial" srclang="zh" label="中文介绍">
你的浏览器无法播放此视频。<a href="claudebar.mp4">下载完整 MP4</a>。
</video>
<p id="caption" aria-live="off" style="min-height:3.4em;margin:20px 0 0;font-size:16px">中文介绍字幕显示在这里。</p>
<nav class="chapters" aria-label="视频章节">
<button data-time="0">天气卡片</button><button data-time="10">Popup 分层</button><button data-time="22">灵动岛</button><button data-time="33">桌面 UI</button><button data-time="46">工作视图</button><button data-time="58">ClaudeBar</button>
</nav>
<div class="links"><a href="claudebar.mp4" download>下载完整影片</a><a href="../../README.md">阅读项目介绍</a><a href="https://github.com/wangxiajun68/ClaudeBar">查看源码</a></div>
<footer>macOS 15+ · Apple Silicon · MIT 开源。影片以当前源码渲染的界面与固定演示数据编排。空间分层、镜头与展开过程为宣传动画；画面中的模型、额度和账单用于展示布局。</footer>
</main><script>
const film=document.getElementById('film');const buttons=[...document.querySelectorAll('[data-time]')];
const track=film.textTracks[0];track.mode='hidden';track.addEventListener('cuechange',()=>{document.getElementById('caption').textContent=[...track.activeCues].map(cue=>cue.text).join(' ');});
buttons.forEach(button=>button.addEventListener('click',()=>{film.currentTime=Number(button.dataset.time);film.play().catch(()=>{});}));
film.addEventListener('timeupdate',()=>{let current=buttons[0];for(const button of buttons)if(film.currentTime>=Number(button.dataset.time))current=button;buttons.forEach(button=>button.setAttribute('aria-current',String(button===current)));});
</script></body></html>
